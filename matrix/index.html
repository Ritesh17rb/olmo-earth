<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OlmoEarth - Grid Matrix Analysis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* Navbar overrides to match root style */
        .navbar-brand {
            font-weight: 600;
        }

        .nav-link.active {
            font-weight: 500;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
                <i class="bi bi-globe-americas text-primary"></i>OlmoEarth
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">Matrix Analysis</a>
                    </li>
                </ul>

                <div class="nav-item dropdown ms-auto">
                    <button class="dark-theme-toggle btn btn-outline-secondary dropdown-toggle" type="button"
                        data-bs-toggle="dropdown">
                        <i class="bi bi-circle-half"></i><span class="d-lg-none ms-2">Toggle theme</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><button class="dropdown-item" data-bs-theme-value="light"><i
                                    class="me-2 bi bi-sun-fill"></i>Light</button></li>
                        <li><button class="dropdown-item" data-bs-theme-value="dark"><i
                                    class="me-2 bi bi-moon-stars-fill"></i>Dark</button></li>
                        <li><button class="dropdown-item" data-bs-theme-value="auto"><i
                                    class="me-2 bi bi-circle-half"></i>Auto</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <aside class="controls-panel">
            <div class="panel-header">
                <h2 class="panel-title">Matrix Configuration</h2>
            </div>

            <div class="panel-section">
                <label class="section-label">Select City</label>
                <div style="display: flex; gap: 0.5rem;">
                    <select id="city-select-1" class="feature-toggle select-input" style="flex: 2;">
                        <option value="bangalore">Bangalore</option>
                        <option value="delhi">Delhi</option>
                        <option value="paris">Paris</option>
                        <option value="mariupol">Mariupol</option>
                    </select>
                    <select id="year-select-1" class="feature-toggle select-input" style="flex: 1;">
                        <option value="2024">2024</option>
                        <option value="2019">2019</option>
                    </select>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="matrix-container">
            <!-- Tabs removed -->

            <!-- Grid View Removed -->

            <div id="matrix-view" style="display: block; width: 100%; height: 100%; overflow: auto;">
                <h3 style="margin-top: 0;">Feature Correlation Matrix</h3>
                <p style="color: var(--secondary-color); font-size: 0.9rem;">Pearson correlation coefficients between
                    selected features based on valid grid cells.</p>
                <div id="correlation-heatmap" style="display: grid; gap: 2px; margin-top: 2rem;">
                    <!-- Injected via JS -->
                </div>
            </div>

            <div id="loading-overlay" class="loading-overlay">
                <div class="spinner"></div>
                <div style="margin-top: 1rem; font-weight: 500;">Loading Data...</div>
            </div>

            <div id="tooltip" class="tooltip"></div>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariupol - OlmoEarth Continuous Analysis</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0f172a; color: #e2e8f0; overflow: hidden;
        }
        #container { display: flex; height: 100vh; }
        #sidebar {
            width: 400px; background: rgba(15, 23, 42, 0.98);
            border-right: 1px solid #334155; padding: 24px; overflow-y: auto;
            z-index: 20; box-shadow: 4px 0 24px rgba(0,0,0,0.4);
        }
        #map { flex: 1; }
        
        h1 {
            font-size: 24px; font-weight: 700; margin-bottom: 4px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        
        .metric-group { margin-bottom: 24px; }
        .group-title {
            font-size: 12px; font-weight: 600; text-transform: uppercase;
            color: #64748b; margin-bottom: 12px; letter-spacing: 1px;
        }
        
        .metric-btn {
            width: 100%; text-align: left; padding: 12px; margin-bottom: 8px;
            background: #1e293b; border: 1px solid #334155; border-radius: 8px;
            color: #cbd5e1; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: space-between;
        }
        .metric-btn:hover { border-color: #60a5fa; background: #263345; }
        .metric-btn.active {
            background: linear-gradient(90deg, rgba(59,130,246,0.2), transparent);
            border-color: #60a5fa; color: #fff;
        }
        
        .legend-box {
            background: #1e293b; padding: 16px; border-radius: 12px;
            border: 1px solid #334155; margin-top: auto;
        }
        .gradient-bar {
            height: 12px; width: 100%; border-radius: 6px;
            margin: 10px 0; position: relative;
        }
        .legend-labels {
            display: flex; justify-content: space-between;
            font-size: 11px; color: #94a3b8; font-family: monospace;
        }
        
        .info-panel {
            position: absolute; top: 20px; right: 20px;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px);
            padding: 20px; border-radius: 12px; border: 1px solid #334155;
            width: 300px; display: none; pointer-events: none; z-index: 1000;
        }
        .info-header { font-weight: 700; color: #fff; margin-bottom: 4px; }
        .info-meta { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
        .info-row {
            display: flex; justify-content: space-between;
            font-size: 13px; margin-bottom: 6px;
        }
        .val-pos { color: #4ade80; }
        .val-neg { color: #f87171; }
        
        .data-status {
            display: inline-block; padding: 4px 8px; border-radius: 4px;
            font-size: 11px; font-weight: 600; margin-top: 8px;
        }
        .status-complete { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status-partial { background: rgba(251, 191, 36, 0.2); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
        
    </style>
</head>
<body>
    <div id="container">
        <div id="sidebar">
            <h1>Mariupol</h1>
            <div class="subtitle">Continuous Scale Analysis • D3.js Powered</div>
            
            <div class="metric-group">
                <div class="group-title">Change Metrics (2019-2024)</div>
                 <button class="metric-btn" onclick="setMetric('change_intensity')">
                    <span>⚡ Disruption Index</span>
                </button>
                <button class="metric-btn" onclick="setMetric('vegetation_index_change_percent')">
                    <span>🌳 Vegetation Change</span>
                </button>
                <button class="metric-btn" onclick="setMetric('urban_density_change_percent')">
                    <span>🏢 Urban Density Change</span>
                </button>
                 <button class="metric-btn" onclick="setMetric('modified_water_index_change_percent')">
                    <span>💧 Water Change</span>
                </button>
                 <button class="metric-btn" onclick="setMetric('uhi_risk_index_change_percent')">
                    <span>🌡️ Heat Risk Change</span>
                </button>
                <button class="metric-btn" onclick="setMetric('spatial_heterogeneity_change_percent')">
                    <span>🕸️ Texture Change</span>
                </button>
            </div>
            
            <div class="metric-group">
                <div class="group-title">Analysis Metrics (2024)</div>
                <button class="metric-btn" onclick="setMetric('vegetation_index')">
                    <span>🌿 Vegetation (NDVI)</span>
                </button>
                <button class="metric-btn" onclick="setMetric('urban_density')">
                    <span>🏙️ Urban Density</span>
                </button>
                <button class="metric-btn" onclick="setMetric('spatial_heterogeneity')">
                    <span>🕸️ Urban Texture</span>
                </button>
                <button class="metric-btn" onclick="setMetric('uhi_risk_index')">
                    <span>🌡️ Urban Heat Risk</span>
                </button>
                <button class="metric-btn" onclick="setMetric('modified_water_index')">
                    <span>💧 Water Bodies</span>
                </button>
                <button class="metric-btn" onclick="setMetric('bare_soil_index')">
                    <span>🏜️ Bare Soil</span>
                </button>
                 <button class="metric-btn" onclick="setMetric('normalized_burn_ratio')">
                    <span>🩺 Land Health</span>
                </button>
                
                <div class="group-title" style="margin-top:20px;">Advanced Urban</div>
                <button class="metric-btn" onclick="setMetric('index_based_built_up_index')">
                    <span>🏗️ IBI (True Built-up)</span>
                </button>
                 <button class="metric-btn" onclick="setMetric('built_up_texture')">
                    <span>🏚️ Built-up Texture</span>
                </button>
                <div class="group-title" style="margin-top:20px;">Advanced Bio</div>
                 <button class="metric-btn" onclick="setMetric('red_edge_index')">
                    <span>🥬 NDRE (Dense Veg)</span>
                </button>
                 <button class="metric-btn" onclick="setMetric('surface_albedo')">
                    <span>☀️ Surface Albedo</span>
                </button>
            </div>
            
            <div class="metric-group">
                <div class="group-title">Layers</div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="metric-btn" style="width:auto" onclick="toggleLayer('osm')">Map</button>
                    <button class="metric-btn" style="width:auto" onclick="toggleLayer('sat')">Sat</button>
                </div>
            </div>
            
            <div class="legend-box">
                <div class="group-title">Continuous Scale</div>
                <div class="legend-labels" id="legend-top-labels">
                    <span>Low</span><span>Neutral</span><span>High</span>
                </div>
                <div id="gradient-bar" class="gradient-bar"></div>
                <div class="legend-labels" id="legend-values">
                    <span id="min-val">0</span>
                    <span id="mid-val">0</span>
                    <span id="max-val">0</span>
                </div>
            </div>
        </div>
        <div id="map"></div>
        <div id="info-panel" class="info-panel"></div>
    </div>

        function getScale(metric) {
            const domain = domains[metric];
            if (metric.includes('vegetation_change')) return divergingScale.domain(domain);
            if (metric.includes('urban_density_change')) return divergingScale.domain(domain);
            if (metric.includes('change')) return divergingScale.domain(domain);
            
            if (metric.includes('vegetation_index')) return vegScale.domain(domain);
            if (metric.includes('modified_water_index')) return waterScale.domain(domain);
            if (metric.includes('uhi_risk_index')) return heatScale.domain(domain);
            if (metric.includes('bare_soil_index')) return soilScale.domain(domain);
            if (metric.includes('moisture_index')) return moistureScale.domain(domain);
            
            if (metric.includes('spatial_heterogeneity')) return textureScale.domain(domain);
            if (metric.includes('change_intensity')) return disruptionScale.domain(domain);
            if (metric.includes('normalized_burn_ratio')) return healthScale.domain(domain);
            
            if (metric.includes('index_based_built_up_index')) return heatScale.domain(domain);  // IBI works well with Heatscale (Red=Built, Green=Not)

            if (metric.includes('surface_albedo')) return albedoScale.domain(domain);
            if (metric.includes('built_up_texture')) return purpleScale.domain(domain);
            
            return sequentialScale.domain(domain);

                const c1 = scale(domain[0]);
                const c2 = scale(domain[1]);
                gradientStr = `linear-gradient(to right, ${c1}, ${c2})`;
                document.getElementById('min-val').textContent = domain[0].toFixed(2);
                document.getElementById('mid-val').textContent = '';
                document.getElementById('max-val').textContent = domain[1].toFixed(2);
            }
            document.getElementById('gradient-bar').style.background = gradientStr;
        }

        function showInfo(props) {
            const panel = document.getElementById('info-panel');
            const analysis = props.analysis;
            let valHtml = '';
            if (currentMetric) {
                let val = getVal({properties: props}, currentMetric);
                if (val !== null) {
                    let formatted = (currentMetric.includes('change')) ? val.toFixed(2) + '%' : val.toFixed(4);
                    let colorClass = val > 0 ? 'val-pos' : (val < 0 ? 'val-neg' : '');
                    valHtml = `<div class="info-row" style="margin-top:12px; border-top:1px solid #334155; padding-top:8px;">
                        <span>Selected</span><span class="${colorClass}" style="font-weight:700">${formatted}</span>
                    </div>`;
                }
            }
            
            // Status Badge
            const status = analysis.years_available.length === 2 ? 'Complete' : 'Partial';
            const statusClass = analysis.years_available.length === 2 ? 'status-complete' : 'status-partial';

            panel.innerHTML = `
                <div class="info-header">${analysis.ward_name}</div>
                <div class="info-meta">ID: ${analysis.ward_no} <span class="data-status ${statusClass}">${status}</span></div>
                <div class="info-row"><span>Veg. Index</span><span>${props.metrics_2024 ? props.metrics_2024.vegetation_index.toFixed(3) : 'N/A'}</span></div>
                <div class="info-row"><span>Urb. Density</span><span>${props.metrics_2024 ? props.metrics_2024.urban_density.toFixed(3) : 'N/A'}</span></div>
                <div class="info-row"><span>Heat Risk</span><span>${props.metrics_2024 ? (props.metrics_2024.uhi_risk_index || 0).toFixed(3) : 'N/A'}</span></div>
                <div class="info-row"><span>Texture</span><span>${props.metrics_2024 ? (props.metrics_2024.spatial_heterogeneity || 0).toFixed(3) : 'N/A'}</span></div>
                <div class="info-row"><span>Disruption</span><span>${props.metrics_2019 ? (props.metrics_2019.change_intensity || 0).toFixed(3) : 'N/A'}</span></div>
                <div class="info-row"><span>Water</span><span>${props.metrics_2024 ? (props.metrics_2024.modified_water_index || 0).toFixed(3) : 'N/A'}</span></div>
                <div class="info-row"><span>IBI</span><span>${props.metrics_2024 ? (props.metrics_2024.index_based_built_up_index || 0).toFixed(3) : 'N/A'}</span></div>
                <div class="info-row"><span>NDRE</span><span>${props.metrics_2024 ? (props.metrics_2024.red_edge_index || 0).toFixed(3) : 'N/A'}</span></div>
                <div class="info-row"><span>Albedo</span><span>${props.metrics_2024 ? (props.metrics_2024.surface_albedo || 0).toFixed(3) : 'N/A'}</span></div>
                ${valHtml}
            `;
            panel.style.display = 'block';
        }
        
        function toggleLayer(type) {
            if(type === 'osm') {
                if(map.hasLayer(osmLayer)) map.removeLayer(osmLayer); else map.addLayer(osmLayer);
            }
            if(type === 'sat') {
                if(map.hasLayer(satelliteLayer)) { map.removeLayer(satelliteLayer); darkLayer.setOpacity(1); }
                else { map.addLayer(satelliteLayer); darkLayer.setOpacity(0); }
            }
        }

        setMetric('vegetation_change_percent');
    </script>
</body>
</html>

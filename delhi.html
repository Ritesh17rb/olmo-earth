<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Delhi - OlmoEarth Continuous Analysis</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <style>
                * {
                        margin: 0;
                        padding: 0;
                        box-sizing: border-box;
                }

                body {
                        font-family: 'Inter', system-ui, sans-serif;
                        background: #0f172a;
                        color: #e2e8f0;
                        overflow: hidden;
                }

                #container {
                        display: flex;
                        height: 100vh;
                }

                #sidebar {
                        width: 400px;
                        background: rgba(15, 23, 42, 0.98);
                        border-right: 1px solid #334155;
                        padding: 24px;
                        overflow-y: auto;
                        z-index: 20;
                        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.4);
                }

                #map {
                        flex: 1;
                }

                h1 {
                        font-size: 24px;
                        font-weight: 700;
                        margin-bottom: 4px;
                        background: linear-gradient(to right, #60a5fa, #a78bfa);
                        -webkit-background-clip: text;
                        background-clip: text;
                        -webkit-text-fill-color: transparent;
                }

                .subtitle {
                        color: #94a3b8;
                        font-size: 14px;
                        margin-bottom: 24px;
                }

                .metric-group {
                        margin-bottom: 24px;
                }

                .group-title {
                        font-size: 12px;
                        font-weight: 600;
                        text-transform: uppercase;
                        color: #64748b;
                        margin-bottom: 12px;
                        letter-spacing: 1px;
                }

                .metric-btn {
                        width: 100%;
                        text-align: left;
                        padding: 12px;
                        margin-bottom: 8px;
                        background: #1e293b;
                        border: 1px solid #334155;
                        border-radius: 8px;
                        color: #cbd5e1;
                        cursor: pointer;
                        transition: all 0.2s;
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                }

                .metric-btn:hover {
                        border-color: #60a5fa;
                        background: #263345;
                }

                .metric-btn.active {
                        background: linear-gradient(90deg, rgba(59, 130, 246, 0.2), transparent);
                        border-color: #60a5fa;
                        color: #fff;
                }

                .legend-box {
                        background: #1e293b;
                        padding: 16px;
                        border-radius: 12px;
                        border: 1px solid #334155;
                        margin-top: auto;
                }

                .gradient-bar {
                        height: 12px;
                        width: 100%;
                        border-radius: 6px;
                        margin: 10px 0;
                        position: relative;
                }

                .legend-labels {
                        display: flex;
                        justify-content: space-between;
                        font-size: 11px;
                        color: #94a3b8;
                        font-family: monospace;
                }

                .info-panel {
                        position: absolute;
                        top: 20px;
                        right: 20px;
                        background: rgba(15, 23, 42, 0.95);
                        backdrop-filter: blur(8px);
                        padding: 20px;
                        border-radius: 12px;
                        border: 1px solid #334155;
                        width: 300px;
                        display: none;
                        pointer-events: none;
                        z-index: 1000;
                }

                .info-header {
                        font-weight: 700;
                        color: #fff;
                        margin-bottom: 4px;
                }

                .info-meta {
                        font-size: 12px;
                        color: #94a3b8;
                        margin-bottom: 12px;
                }

                .info-row {
                        display: flex;
                        justify-content: space-between;
                        font-size: 13px;
                        margin-bottom: 6px;
                }

                .val-pos {
                        color: #4ade80;
                }

                .val-neg {
                        color: #f87171;
                }

                .data-status {
                        display: inline-block;
                        padding: 4px 8px;
                        border-radius: 4px;
                        font-size: 11px;
                        font-weight: 600;
                        margin-top: 8px;
                }

                .status-complete {
                        background: rgba(34, 197, 94, 0.2);
                        color: #22c55e;
                        border: 1px solid rgba(34, 197, 94, 0.3);
                }

                .status-partial {
                        background: rgba(251, 191, 36, 0.2);
                        color: #fbbf24;
                        border: 1px solid rgba(251, 191, 36, 0.3);
                }
        </style>
</head>

<body>
        <div id="container">
                <div id="sidebar">
                        <h1>Delhi</h1>


                        <div class="metric-group">
                                <div class="group-title">Change Metrics (2019-2024)</div>
                                <button class="metric-btn" onclick="setMetric('change_intensity')">
                                        <span>⚡ Disruption Index</span>
                                </button>
                                <button class="metric-btn" onclick="setMetric('vegetation_index_change_percent')">
                                        <span>🌳 Vegetation Change</span>
                                </button>
                                <button class="metric-btn" onclick="setMetric('urban_density_change_percent')">
                                        <span>🏢 Urban Density Change</span>
                                </button>
                                <button class="metric-btn" onclick="setMetric('modified_water_index_change_percent')">
                                        <span>💧 Water Change</span>
                                </button>
                                <button class="metric-btn" onclick="setMetric('uhi_risk_index_change_percent')">
                                        <span>🌡️ Heat Risk Change</span>
                                </button>
                                <button class="metric-btn" onclick="setMetric('spatial_heterogeneity_change_percent')">
                                        <span>🕸️ Texture Change</span>
                                </button>
                        </div>

                        <div class="metric-group">
                                <div class="group-title">Analysis Metrics (2024)</div>
                                <button class="metric-btn" onclick="setMetric('vegetation_index')">
                                        <span>🌿 Vegetation (NDVI)</span>
                                </button>
                                <button class="metric-btn" onclick="setMetric('urban_density')">
                                        <span>🏙️ Urban Density</span>
                                </button>
                                <button class="metric-btn" onclick="setMetric('spatial_heterogeneity')">
                                        <span>🕸️ Urban Texture</span>
                                </button>
                                <button class="metric-btn" onclick="setMetric('uhi_risk_index')">
                                        <span>🌡️ Urban Heat Risk</span>
                                </button>
                                <button class="metric-btn" onclick="setMetric('modified_water_index')">
                                        <span>💧 Water Bodies</span>
                                </button>
                                <button class="metric-btn" onclick="setMetric('bare_soil_index')">
                                        <span>🏜️ Bare Soil</span>
                                </button>
                                <button class="metric-btn" onclick="setMetric('normalized_burn_ratio')">
                                        <span>🩺 Land Health</span>
                                </button>

                                <div class="group-title" style="margin-top:20px;">Advanced Urban</div>
                                <button class="metric-btn" onclick="setMetric('index_based_built_up_index')">
                                        <span>🏗️ IBI (True Built-up)</span>
                                </button>
                                <button class="metric-btn" onclick="setMetric('built_up_texture')">
                                        <span>🏚️ Built-up Texture</span>
                                </button>
                                <div class="group-title" style="margin-top:20px;">Advanced Bio</div>
                                <button class="metric-btn" onclick="setMetric('red_edge_index')">
                                        <span>🥬 NDRE (Dense Veg)</span>
                                </button>
                                <button class="metric-btn" onclick="setMetric('surface_albedo')">
                                        <span>☀️ Surface Albedo</span>
                                </button>
                        </div>

                        <div class="metric-group">
                                <div class="group-title">Layers</div>
                                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                                        <button class="metric-btn" style="width:auto"
                                                onclick="toggleLayer('osm')">Map</button>
                                        <button class="metric-btn" style="width:auto"
                                                onclick="toggleLayer('sat')">Sat</button>
                                </div>
                        </div>

                        <div class="legend-box">
                                <div class="group-title">Continuous Scale</div>
                                <div class="legend-labels" id="legend-top-labels">
                                        <span>Low</span><span>Neutral</span><span>High</span>
                                </div>
                                <div id="gradient-bar" class="gradient-bar"></div>
                                <div class="legend-labels" id="legend-values">
                                        <span id="min-val">0</span>
                                        <span id="mid-val">0</span>
                                        <span id="max-val">0</span>
                                </div>
                        </div>
                </div>
                <div id="map"></div>
                <div id="info-panel" class="info-panel"></div>
        </div>

        <script>
                let geojsonData = null;
                let map, geoJsonLayer;
                let currentMetric = 'change_intensity';
                let colorScale;

                // Initialize Map
                function initMap() {
                        // Updated coordinates for Delhi
                        map = L.map('map').setView([28.6139, 77.2090], 11);

                        // Dark Mode Tiles
                        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                                attribution: '&copy; OlmoEarth',
                                subdomains: 'abcd',
                                maxZoom: 19
                        }).addTo(map);

                        // Fetch Geometry and Data
                        Promise.all([
                                fetch('assets/Delhi.json').then(r => r.json()),
                                fetch('matrix/data/delhi_detailed_analysis.json').then(r => r.json())
                        ]).then(([geoData, analysisData]) => {
                                // Merge Data
                                const analysisMap = new Map();
                                if (analysisData.wards) {
                                        analysisData.wards.forEach(w => {
                                                analysisMap.set(String(w.ward_no), w);
                                        });
                                }

                                geoData.features.forEach(f => {
                                        // Try to find match. Delhi usually uses 'WARD_NO' or 'ward_no'
                                        const id = String(f.properties.WARD_NO || f.properties.ward_no || f.properties.Ward_No || '');
                                        const data = analysisMap.get(id);
                                        if (data) {
                                                Object.assign(f.properties, data);
                                        }
                                });

                                geojsonData = geoData;
                                renderMap();
                                setMetric(currentMetric);
                        })
                                .catch(err => console.error("Error loading Delhi data:", err));
                }

                // Continuous Color Scales (Matching Bangalore)
                const sequentialScale = d3.scaleLinear().range(['#1e293b', '#3b82f6', '#93c5fd']).interpolate(d3.interpolateRgb).clamp(true);
                const divergingScale = d3.scaleLinear().range(['#ef4444', '#1e293b', '#22c55e']).interpolate(d3.interpolateRgb).clamp(true);
                const vegScale = d3.scaleLinear().range(['#1e293b', '#166534', '#4ade80']).interpolate(d3.interpolateRgb).clamp(true);
                const waterScale = d3.scaleLinear().range(['#1e293b', '#0891b2', '#67e8f9']).interpolate(d3.interpolateRgb).clamp(true);
                const heatScale = d3.scaleLinear().range(['#22c55e', '#1e293b', '#ef4444']).interpolate(d3.interpolateRgb).clamp(true);
                const soilScale = d3.scaleLinear().range(['#1e293b', '#92400e', '#fbbf24']).interpolate(d3.interpolateRgb).clamp(true);
                const textureScale = d3.scaleLinear().range(['#1e293b', '#7e22ce', '#d8b4fe']).interpolate(d3.interpolateRgb).clamp(true);
                const disruptionScale = d3.scaleLinear().range(['#1e293b', '#b91c1c', '#fca5a5']).interpolate(d3.interpolateRgb).clamp(true);
                const healthScale = d3.scaleLinear().range(['#ef4444', '#1e293b', '#22c55e']).interpolate(d3.interpolateRgb).clamp(true);
                const albedoScale = d3.scaleLinear().range(['#1e293b', '#64748b', '#f8fafc']).interpolate(d3.interpolateRgb).clamp(true);

                const metricsConfig = {
                        'change_intensity': { label: 'Disruption Index', scale: disruptionScale, domain: [0, 0.5] },
                        'vegetation_index_change_percent': { label: 'Veg Change %', scale: divergingScale, domain: [-50, 0, 50] },
                        'urban_density_change_percent': { label: 'Urban Change %', scale: divergingScale, domain: [-20, 0, 50] },

                        'vegetation_index': { label: 'NDVI (2024)', scale: vegScale, domain: [0, 0.4, 0.8] },
                        'urban_density': { label: 'Urban Density', scale: soilScale, domain: [-0.2, 0.1, 0.4] },
                        'uhi_risk_index': { label: 'Heat Risk', scale: heatScale, domain: [-0.5, 0, 0.5] },

                        'modified_water_index': { label: 'Water Index', scale: waterScale, domain: [-0.4, -0.2, 0.1] },
                        'bare_soil_index': { label: 'Bare Soil', scale: soilScale, domain: [-0.1, 0.05, 0.2] },
                        'normalized_burn_ratio': { label: 'Land Health', scale: healthScale, domain: [0, 0.2, 0.4] },

                        'index_based_built_up_index': { label: 'IBI (Built-Up)', scale: heatScale, domain: [-0.5, 0, 0.5] },
                        'built_up_texture': { label: 'Structure Texture', scale: textureScale, domain: [0, 0.1, 0.3] },
                        'red_edge_index': { label: 'Red Edge (Dense Veg)', scale: vegScale, domain: [0, 0.2, 0.4] },
                        'surface_albedo': { label: 'Albedo', scale: albedoScale, domain: [0, 0.2, 0.4] },
                        'spatial_heterogeneity': { label: 'Texture', scale: textureScale, domain: [0, 100, 200] },

                        'modified_water_index_change_percent': { label: 'Water Change %', scale: divergingScale, domain: [-50, 0, 50] },
                        'uhi_risk_index_change_percent': { label: 'Heat Risk Change %', scale: divergingScale, domain: [-20, 0, 20] },
                        'spatial_heterogeneity_change_percent': { label: 'Texture Change %', scale: divergingScale, domain: [-20, 0, 20] }
                };

                function setMetric(metric) {
                        currentMetric = metric;

                        // Update buttons
                        document.querySelectorAll('.metric-btn').forEach(btn => {
                                btn.classList.remove('active');
                                if (btn.onclick.toString().includes(metric)) btn.classList.add('active');
                        });

                        // Update Legend
                        updateLegend();

                        // Update Map
                        if (geoJsonLayer) {
                                geoJsonLayer.eachLayer(layer => {
                                        const val = getMetricValue(layer.feature.properties, metric);
                                        const color = getColor(val);
                                        layer.setStyle({
                                                fillColor: color,
                                                fillOpacity: 0.8,
                                                weight: 1,
                                                color: '#334155'
                                        });
                                });
                        }
                }

                function getMetricValue(props, metric) {
                        if (metric.includes('change')) {
                                return props.change_metrics ? props.change_metrics[metric] : 0;
                        }
                        if (props.metrics_2024[metric] !== undefined) return props.metrics_2024[metric];
                        if (props.metrics_2019 && metric === 'change_intensity') return props.metrics_2019.change_intensity;
                        if (props.metrics_2024 && metric === 'change_intensity') return props.metrics_2024.change_intensity;
                        return 0;
                }

                function getColor(value) {
                        const config = metricsConfig[currentMetric];
                        if (!config) return '#334155';
                        const scale = config.scale.domain(config.domain);
                        return scale(value);
                }

                function updateLegend() {
                        const config = metricsConfig[currentMetric];
                        if (!config) return;

                        const domain = config.domain;
                        document.getElementById('min-val').textContent = domain[0].toFixed(2);
                        document.getElementById('max-val').textContent = domain[domain.length - 1].toFixed(2);
                        document.getElementById('mid-val').textContent = domain.length > 2 ? domain[1].toFixed(2) : ((domain[0] + domain[1]) / 2).toFixed(2);

                        // Draw gradient
                        const canvas = document.createElement('canvas');
                        canvas.width = 300; canvas.height = 1;
                        const ctx = canvas.getContext('2d');
                        const scale = config.scale.domain(config.domain);

                        for (let i = 0; i < 300; i++) {
                                const t = i / 300;
                                const val = domain[0] + t * (domain[domain.length - 1] - domain[0]);
                                ctx.fillStyle = scale(val);
                                ctx.fillRect(i, 0, 1, 1);
                        }
                        document.getElementById('gradient-bar').style.backgroundImage = `url(${canvas.toDataURL()})`;
                        document.getElementById('gradient-bar').style.backgroundSize = '100% 100%';
                }

                function renderMap() {
                        if (geoJsonLayer) map.removeLayer(geoJsonLayer);

                        geoJsonLayer = L.geoJSON(geojsonData, {
                                onEachFeature: (feature, layer) => {
                                        layer.on({
                                                mouseover: (e) => {
                                                        const layer = e.target;
                                                        layer.setStyle({ weight: 3, color: '#fff', fillOpacity: 1 });
                                                        showInfo(feature.properties, e.containerPoint);
                                                },
                                                mouseout: (e) => {
                                                        geoJsonLayer.resetStyle(e.target);
                                                        document.getElementById('info-panel').style.display = 'none';
                                                }
                                        });
                                }
                        }).addTo(map);

                        // Adjust bounds to fit data (Delhi)
                        if (geojsonData.features.length > 0) {
                                map.fitBounds(geoJsonLayer.getBounds());
                        }
                }

                function showInfo(props, point) {
                        const p = document.getElementById('info-panel');
                        const m = props.metrics_2024;
                        const c = props.change_metrics || {};

                        // Determine status
                        const hasChange = props.analysis && props.analysis.has_change_analysis;
                        const statusHtml = hasChange ?
                                `<span class="data-status status-complete">Analysis Complete</span>` :
                                `<span class="data-status status-partial">Partial Data</span>`;

                        // Helper for change display
                        const fmtChg = (val) => {
                                if (val === undefined || val === null) return 'N/A';
                                const color = val > 0 ? '#4ade80' : (val < 0 ? '#f87171' : '#94a3b8');
                                const sign = val > 0 ? '+' : '';
                                return `<span style="color:${color}">${sign}${val.toFixed(1)}%</span>`;
                        };

                        const fmtVal = (val) => val ? val.toFixed(3) : 'N/A';

                        p.innerHTML = `
                <div class="info-header">${props.KGISWardName || props.ward_name || ('Ward ' + props.ward_no)}</div>
                <div class="info-meta">Ward ID: ${props.ward_no || 'N/A'} • ${statusHtml}</div>
                
                <div style="border-top:1px solid #334155; margin:10px 0; padding-top:10px;">
                    <div style="font-weight:600; color:#fff; margin-bottom:8px;">Core Metrics (2024)</div>
                    <div class="info-row"><span>Vegetation (NDVI)</span> <span>${fmtVal(m.vegetation_index)}</span></div>
                    <div class="info-row"><span>Urban Density</span> <span>${fmtVal(m.urban_density)}</span></div>
                    <div class="info-row"><span>Heat Risk</span> <span>${fmtVal(m.uhi_risk_index)}</span></div>
                    <div class="info-row"><span>Land Health</span> <span>${fmtVal(m.normalized_burn_ratio)}</span></div>
                </div>

                <div style="border-top:1px solid #334155; margin:10px 0; padding-top:10px;">
                    <div style="font-weight:600; color:#fff; margin-bottom:8px;">Change (2019-2024)</div>
                    <div class="info-row"><span>Vegetation</span> ${fmtChg(c.vegetation_index_change_percent)}</div>
                    <div class="info-row"><span>Urban Density</span> ${fmtChg(c.urban_density_change_percent)}</div>
                    <div class="info-row"><span>Heat Risk</span> ${fmtChg(c.uhi_risk_index_change_percent)}</div>
                    <div class="info-row"><span>Overall Disruption</span> <span style="color:#fbbf24">${fmtVal(props.metrics_2024.change_intensity || props.metrics_2019.change_intensity)}</span></div>
                </div>
            `;

                        p.style.display = 'block';
                }

                // Initialize
                initMap();

                function toggleLayer(type) {
                        if (type === 'sat') {
                                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                                        attribution: 'Tiles &copy; Esri'
                                }).addTo(map);
                        } else {
                                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                                        attribution: '&copy; OlmoEarth'
                                }).addTo(map);
                        }
                }
        </script>
</body>

</html>
